<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07131d"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>工具快手</title></head><body>
<main class="app"><section id="cameraContainer"><video id="cameraVideo" autoplay playsinline muted></video><div id="highlightBox" class="hidden"></div><div class="topbar"><b>TOOL DASH</b><span id="cameraState">相機未啟動</span></div><button id="cancelButton" class="end-button hidden" title="結束" tabindex="-1">結束／回到首頁</button></section>
<section id="idlePanel" class="panel"><h1>工具快手</h1><p class="hint">辨識指定工具後，將它拿離畫面即可完成。</p><button id="startButton" class="primary" title="開始" tabindex="-1">開始遊戲</button><p id="statusLabel" class="status">正在準備工具辨識模型…</p></section>
<section id="playingPanel" class="panel hidden"><p id="promptLabel" class="prompt"></p><p id="timerLabel" class="timer"></p><p id="detectStatus" class="status"></p></section>
<section id="successPanel" class="panel hidden"><h2 id="successMainText"></h2><p id="successRankText" class="rank"></p><div class="button-row"><button id="restartButton" title="重新開始" tabindex="-1">回到首頁</button><button id="enterNameButton" title="留下大名" tabindex="-1">留下紀錄</button></div></section>
<section id="nameEntryPanel" class="panel hidden"><h2>留下名字</h2><input id="nameInput" type="text" title="輸入姓名" placeholder="挑戰者" maxlength="20"><button id="confirmNameButton" class="primary" title="確認" tabindex="-1">儲存</button></section>
<section id="leaderboardPanel" class="panel hidden"><h2>本機排行榜</h2><ol id="leaderboardList"></ol><button id="restartButton2" class="primary" title="重新開始" tabindex="-1">再玩一次</button></section></main>
<script src="lib/ort/ort.min.js"></script><script type="module" src="js/app.js"></script></body></html>
